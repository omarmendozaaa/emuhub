name: release

# Builds the single-file EmuHub binaries (emulators embedded) for Linux,
# Windows and macOS. Pushes to main and pull requests upload them as
# artifacts; pushing a tag like v0.1.0 also publishes a GitHub release.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps glibc old enough for most friends' distros.
          - target: linux-amd64
            os: ubuntu-22.04
          - target: windows-amd64
            os: ubuntu-22.04
          - target: darwin-arm64
            os: macos-14
          - target: darwin-amd64
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/emuhub-build/downloads
          key: emulators-${{ hashFiles('emulators.lock.json') }}-${{ matrix.target }}

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: scripts/build-release.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
