name: release

# Builds EmuHub for Linux and Windows; macOS is built by hand on a Mac (see
# scripts/publish-release.sh). Pushes to main and pull requests upload the
# builds as artifacts; pushing a tag like v0.2.0 also publishes them as a
# GitHub release, which every EmuHub already installed then updates to.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps glibc old enough for most friends' distros.
          - target: linux-amd64
            os: ubuntu-22.04
          - target: windows-amd64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0

      # The emulators the bundler downloads, and the published emulator
      # package, which every build must embed exactly.
      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/emuhub-build/downloads
            ~/.cache/emuhub-build/published
          key: emulators-${{ hashFiles('emulators.lock.json') }}-${{ matrix.target }}

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: scripts/build-release.sh ${{ matrix.target }}
        env:
          EMUHUB_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          EMUHUB_REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v4
        with:
          name: EmuHub-${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: scripts/publish-release.sh "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
          EMUHUB_REPO: ${{ github.repository }}
